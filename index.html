<main class="mx-auto grid max-w-[1700px] gap-4 p-4 lg:grid-cols-[minmax(380px,520px)_1fr]">
  <section id="editor" class="space-y-4 lg:max-h-[calc(100vh-5.5rem)] lg:overflow-y-auto lg:pr-1">
    <div class="card"><h2><i data-lucide="building-2" class="h-4 w-4 text-indigo-500"></i>Your details</h2>
      <div class="grid grid-cols-2 gap-3">
        <div class="col-span-2"><label class="lbl">Name / company</label><input class="fld" data-k="company.name"></div>
        <div><label class="lbl">Email</label><input class="fld" data-k="company.email"></div>
        <div><label class="lbl">Tax ID</label><input class="fld" data-k="company.taxId"></div>
        <div class="col-span-2"><label class="lbl">Address</label><textarea rows="2" class="fld" data-k="company.address"></textarea></div>
        <div class="col-span-2"><label class="lbl">Logo (URL or upload)</label>
          <div class="flex gap-2"><input class="fld" data-k="company.logo" placeholder="https://…/logo.png">
          <label class="btn shrink-0"><i data-lucide="upload" class="h-4 w-4"></i>Upload<input type="file" accept="image/*" id="logoFile" class="hidden"></label>
          <button class="btn" id="logoClear" title="Remove logo"><i data-lucide="x" class="h-4 w-4"></i></button></div></div>
      </div></div>

    <div class="card"><h2><i data-lucide="user" class="h-4 w-4 text-indigo-500"></i>Client</h2>
      <div class="mb-3 flex gap-2"><select id="clientSel" class="fld"></select>
        <button class="btn" id="saveClient"><i data-lucide="user-plus" class="h-4 w-4"></i>Save</button>
        <button class="btn" id="delClient" title="Delete saved client"><i data-lucide="trash-2" class="h-4 w-4"></i></button></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="lbl">Client name</label><input class="fld" data-k="client.name"></div>
        <div><label class="lbl">Client email</label><input class="fld" data-k="client.email"></div>
        <div class="col-span-2"><label class="lbl">Client address</label><textarea rows="2" class="fld" data-k="client.address"></textarea></div>
      </div></div>

    <div class="card"><h2><i data-lucide="hash" class="h-4 w-4 text-indigo-500"></i>Invoice details</h2>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="lbl">Number</label><input class="fld" data-k="number"></div>
        <div><label class="lbl">Currency</label><select class="fld" data-k="currency"></select></div>
        <div><label class="lbl">Issue date</label><input type="date" class="fld" data-k="issue"></div>
        <div><label class="lbl">Due date</label><input type="date" class="fld" data-k="due"></div>
        <div class="col-span-2"><label class="lbl">Accent color</label>
          <div class="flex flex-wrap items-center gap-2"><span id="swatches" class="flex flex-wrap items-center gap-2"></span>
          <input type="color" id="accent" title="Pick a custom color" aria-label="Custom accent color">
          <button class="btn !py-1" id="accentReset">Theme default</button></div></div>
      </div></div>

    <div class="card"><h2><i data-lucide="list" class="h-4 w-4 text-indigo-500"></i>Line items</h2>
      <div id="items" class="space-y-2"></div>
      <button class="btn mt-3" id="addItem"><i data-lucide="plus" class="h-4 w-4"></i>Add line</button>
      <div class="mt-4 grid grid-cols-2 gap-3">
        <div><label class="lbl">Tax label</label><input class="fld" data-k="taxLabel" maxlength="20" placeholder="Tax, VAT, GST…"></div>
        <div><label class="lbl">Tax rate (%)</label><input type="number" min="0" step="0.01" class="fld" data-k="tax"></div>
        <div><label class="lbl">Discount</label><input type="number" min="0" step="0.01" class="fld" data-k="discount"></div>
        <div><label class="lbl">Discount type</label><select class="fld" data-k="discType"><option value="%">Percent (%)</option><option value="flat">Flat amount</option></select></div>
      </div></div>

    <div class="card"><h2><i data-lucide="sticky-note" class="h-4 w-4 text-indigo-500"></i>Extras</h2>
      <div class="space-y-3">
        <div><label class="lbl">Notes</label><textarea rows="2" class="fld" data-k="notes"></textarea></div>
        <div><label class="lbl">Payment terms</label><textarea rows="2" class="fld" data-k="terms"></textarea></div>
        <div><label class="lbl">Footer message</label><input class="fld" data-k="footer"></div>
      </div></div>

    <div class="card"><h2><i data-lucide="hard-drive" class="h-4 w-4 text-indigo-500"></i>Templates &amp; backup</h2>
      <div class="mb-3 flex gap-2"><input id="tplName" class="fld" placeholder="Template or draft name">
        <button class="btn btn-p" id="saveTpl"><i data-lucide="save" class="h-4 w-4"></i>Save</button></div>
      <div id="tplList" class="mb-3 space-y-1.5"></div>
      <div class="flex flex-wrap gap-2">
        <button class="btn" id="exp"><i data-lucide="file-down" class="h-4 w-4"></i>Export JSON</button>
        <label class="btn"><i data-lucide="file-up" class="h-4 w-4"></i>Import JSON<input type="file" accept=".json,application/json" id="imp" class="hidden"></label>
        <button class="btn" id="dup" title="Keep everything, bump the invoice number and reset the dates"><i data-lucide="copy-plus" class="h-4 w-4"></i>Next invoice</button>
        <button class="btn" id="reset"><i data-lucide="rotate-ccw" class="h-4 w-4"></i>New blank</button>
      </div>
      <p class="mt-2 text-xs text-slate-500">Everything is stored in this browser only. Export a backup now and then.</p></div>
  </section>

  <section id="previewSec" class="min-w-0">
    <div id="wrap" class="overflow-hidden rounded-xl bg-slate-300/60 p-0 shadow-inner dark:bg-slate-900 lg:sticky lg:top-[4.5rem]">
      <div id="scaler" style="transform-origin:top left"><div id="preview"></div></div>
    </div>
  </section>
</main>
<footer class="site">
  <div>Built by <a href="https://sowninteractive.github.io/" target="_blank" rel="noopener">Sown Interactive</a></div>
  <div class="r">Nurturing simple beginnings into living world · <a href="mailto:sowninteractive@gmail.com">Contact us</a></div>
</footer>
<div id="mobTabs"><button data-v="edit" class="on">Edit</button><button data-v="prev">Preview</button></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const CUR=['USD','EUR','GBP','CAD','AUD','NZD','CHF','JPY','INR','MXN','BRL','SEK','NOK','DKK','SGD','ZAR','AED'];
const today=(d=0)=>{const t=new Date();t.setDate(t.getDate()+d);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const sample=()=>({
  docType:'Invoice',theme:'min',accent:'',number:'INV-0001',issue:today(),due:today(14),currency:'USD',
  company:{name:'Northwind Studio',email:'hello@northwind.studio',taxId:'TAX-123456789',address:'42 Harbor Street\nSuite 5\nVancouver, BC V6B 1A1',logo:''},
  client:{name:'Acme Corporation',email:'billing@acme.com',address:'1200 Market Avenue\nSan Francisco, CA 94103'},
  items:[{id:uid(),desc:'Brand identity design',qty:1,price:2400},{id:uid(),desc:'Website design (5 pages)',qty:5,price:450},{id:uid(),desc:'Consulting (hours)',qty:6,price:95}],
  tax:8,taxLabel:'Tax',discount:5,discType:'%',
  notes:'Thank you for your business! Source files will be delivered after payment.',
  terms:'Payment due within 14 days. Bank transfer or credit card accepted. Late fee of 1.5% per month.',
  footer:'Northwind Studio · northwind.studio'
});
const blank=()=>({...sample(),number:'INV-0001',company:{name:'',email:'',taxId:'',address:'',logo:''},client:{name:'',email:'',address:''},items:[{id:uid(),desc:'',qty:1,price:0}],tax:0,discount:0,notes:'',terms:'',footer:''});

let store={clients:[],templates:[],draft:null,dark:false};
try{Object.assign(store,JSON.parse(localStorage.getItem('nli')||'{}'))}catch(e){}
let warned=false;
const persist=()=>{try{localStorage.setItem('nli',JSON.stringify(store));warned=false}catch(e){if(!warned){warned=true;toast('Browser storage is full or blocked — export a backup and delete old templates')}}};
if(!Array.isArray(store.clients))store.clients=[];if(!Array.isArray(store.templates))store.templates=[];
function normalize(d){
  const o=d&&typeof d==='object'?d:{},str=(v,m=2000)=>typeof v==='string'?v.slice(0,m):'',num=v=>Number.isFinite(+v)?+v:0;
  const co=o.company||{},cl=o.client||{},logo=str(co.logo,900000);
  const items=(Array.isArray(o.items)?o.items:[]).slice(0,200).map(i=>({id:uid(),desc:str(i&&i.desc,500),qty:num(i&&i.qty),price:num(i&&i.price)}));
  return{docType:o.docType==='Receipt'?'Receipt':'Invoice',theme:['min','dark','exec'].includes(o.theme)?o.theme:'min',
    accent:/^#[0-9a-f]{6}$/i.test(o.accent||'')?o.accent:'',number:str(o.number,40),issue:str(o.issue,10),due:str(o.due,10),
    currency:CUR.includes(o.currency)?o.currency:'USD',
    company:{name:str(co.name,200),email:str(co.email,200),taxId:str(co.taxId,100),address:str(co.address,500),logo:/^(data:image\/|https?:\/\/)/i.test(logo)?logo:''},
    client:{name:str(cl.name,200),email:str(cl.email,200),address:str(cl.address,500)},
    items:items.length?items:[{id:uid(),desc:'',qty:1,price:0}],
    tax:Math.max(0,num(o.tax)),taxLabel:str(o.taxLabel,20)||'Tax',discount:Math.max(0,num(o.discount)),discType:o.discType==='flat'?'flat':'%',
    notes:str(o.notes),terms:str(o.terms),footer:str(o.footer,500)};
}
let S=normalize(store.draft||sample());

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
const get=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
const set=(o,p,v)=>{const k=p.split('.');const l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v};
const money=n=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:S.currency}).format(n||0)}catch(e){return (n||0).toFixed(2)}};
const fdate=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'';
const dp=()=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:S.currency}).resolvedOptions().maximumFractionDigits}catch(e){return 2}};
const toU=x=>Math.round((+x||0)*10**dp()+1e-7);
const lineU=i=>toU((+i.qty||0)*(+i.price||0));
const moneyU=u=>money(u/10**dp());
function totals(){
  const sub=S.items.reduce((a,i)=>a+lineU(i),0);
  const disc=Math.min(sub,S.discType==='%'?Math.round(sub*(+S.discount||0)/100):toU(S.discount));
  const tax=Math.round((sub-disc)*(+S.tax||0)/100);
  return{sub,disc,tax,total:sub-disc+tax};
}

const THEME_AC={min:'#0f172a',dark:'#6366f1',exec:'#1e3a5f'};
const PRESETS=['#4f46e5','#0ea5e9','#10b981','#f59e0b','#ef4444','#ec4899','#6b3f5e','#0f172a'];
const validHex=c=>/^#[0-9a-f]{6}$/i.test(c||'');
function onColor(h){const n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return(0.299*r+0.587*g+0.114*b)>160?'#0f172a':'#ffffff'}
function shade(h){const n=parseInt(h.slice(1),16),m=[n>>16,(n>>8)&255,n&255],base=[11,16,32];return'#'+m.map((v,i)=>Math.round(v*.38+base[i]*.62).toString(16).padStart(2,'0')).join('')}
const accStyle=()=>validHex(S.accent)?` style="--ac:${S.accent};--on:${onColor(S.accent)}${S.theme==='dark'?';--hb:'+shade(S.accent):''}"`:'';
function accentUI(){
  const cur=validHex(S.accent)?S.accent.toLowerCase():'';
  $('#swatches').innerHTML=PRESETS.map(c=>`<button type="button" class="sw ${c===cur?'on':''}" data-c="${c}" style="background:${c}" title="${c}" aria-label="Accent ${c}"></button>`).join('');
  $('#accent').value=cur||THEME_AC[S.theme];
}
function invoiceHTML(forPdf){
  const t=totals(),rec=S.docType==='Receipt',c=S.company,k=S.client;
  const dk=S.theme==='dark';
  const rows=S.items.map(i=>`<tr><td class="pre">${esc(i.desc)}</td><td class="r">${+i.qty||0}</td><td class="r">${money(+i.price)}</td><td class="r"><b>${moneyU(lineU(i))}</b></td></tr>`).join('');
  return `<div class="inv t-${S.theme}" id="paper"${accStyle()}>
  <div class="hd ${dk?'dk':''}">
    <div>${c.logo?`<img src="${esc(c.logo)}"${forPdf&&!/^data:/.test(c.logo)?' crossorigin="anonymous"':' onerror="this.style.display=\'none\'"'} style="max-height:60px;max-width:200px;margin-bottom:10px;display:block" alt="">`:''}
      <div style="font-size:17px;font-weight:700">${esc(c.name)}</div>
      <div class="pre" style="opacity:.75">${esc(c.address)}</div>
      ${c.email?`<div style="opacity:.75">${esc(c.email)}</div>`:''}${c.taxId?`<div style="opacity:.75">Tax ID: ${esc(c.taxId)}</div>`:''}</div>
    <div style="text-align:right"><h1>${S.docType}</h1>
      <div style="margin-top:8px;opacity:.85"><b>#${esc(S.number)}</b></div>
      <div style="opacity:.75">Issued: ${fdate(S.issue)}</div>
      ${rec?'':`<div style="opacity:.75">Due: ${fdate(S.due)}</div>`}</div>
  </div>
  ${rec?'<div class="stamp">PAID</div>':''}
  <div class="bd">
    <div style="margin-top:6px"><div class="muted" style="font-size:11px;font-weight:600">${rec?'Received from':'Billed to'}</div>
      <div style="font-weight:700;font-size:15px">${esc(k.name)}</div>
      <div class="pre muted">${esc(k.address)}</div><div class="muted">${esc(k.email)}</div></div>
    <table><thead><tr><th>Description</th><th class="r" style="width:60px">Qty</th><th class="r" style="width:110px">Unit price</th><th class="r" style="width:120px">Total</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="tot">
      <div><span class="muted">Subtotal</span><span>${moneyU(t.sub)}</span></div>
      ${t.disc?`<div><span class="muted">Discount${S.discType==='%'?` (${+S.discount}%)`:''}</span><span>−${moneyU(t.disc)}</span></div>`:''}
      ${+S.tax?`<div><span class="muted">${esc(S.taxLabel||'Tax')} (${+S.tax}%)</span><span>${moneyU(t.tax)}</span></div>`:''}
      <div class="gt"><span>${rec?'Amount paid':'Total due'}</span><span>${moneyU(t.total)}</span></div>
    </div>
    ${S.notes?`<div style="margin-top:32px"><div class="muted" style="font-size:11px;font-weight:600">Notes</div><div class="pre">${esc(S.notes)}</div></div>`:''}
    ${S.terms?`<div style="margin-top:16px"><div class="muted" style="font-size:11px;font-weight:600">Payment terms</div><div class="pre">${esc(S.terms)}</div></div>`:''}
    ${S.footer?`<div class="muted" style="margin-top:40px;padding-top:14px;border-top:1px solid #e2e8f0;text-align:center;font-size:12px">${esc(S.footer)}</div>`:''}
  </div></div>`;
}
function fit(){
  const w=$('#wrap').clientWidth;if(!w)return;const sc=Math.min(1,(w-32)/794);
  $('#scaler').style.transform=`scale(${sc})`;
  const h=$('#preview').offsetHeight*sc;$('#wrap').style.height=(h+32)+'px';
}
function render(){
  $('#preview').innerHTML=invoiceHTML();fit();
  store.draft=S;persist();
}
function items(){
  $('#items').innerHTML=S.items.map((it,i)=>`<div class="rounded-lg border border-slate-200 p-2 dark:border-slate-800" data-i="${i}">
    <div class="flex gap-2"><input class="fld" data-f="desc" aria-label="Description" placeholder="Description" value="${esc(it.desc)}">
      <div class="flex shrink-0">
        <button class="ib" data-a="up" title="Move up"><i data-lucide="arrow-up" class="h-4 w-4"></i></button>
        <button class="ib" data-a="down" title="Move down"><i data-lucide="arrow-down" class="h-4 w-4"></i></button>
        <button class="ib" data-a="del" title="Delete"><i data-lucide="trash-2" class="h-4 w-4"></i></button></div></div>
    <div class="mt-2 grid grid-cols-3 gap-2">
      <div><label class="lbl">Qty</label><input type="number" min="0" step="any" class="fld" data-f="qty" value="${+it.qty}"></div>
      <div><label class="lbl">Unit price</label><input type="number" min="0" step="any" class="fld" data-f="price" value="${+it.price}"></div>
      <div><label class="lbl">Total</label><div class="fld bg-slate-50 font-semibold dark:bg-slate-800" data-t>${moneyU(lineU(it))}</div></div></div></div>`).join('');
  icons();linkLabels();
}
const icons=()=>{try{lucide.createIcons()}catch(e){}};
let lid=0;function linkLabels(){$$('.lbl').forEach(l=>{if(l.htmlFor)return;const f=l.parentElement.querySelector('input,select,textarea');if(f){if(!f.id)f.id='f'+(++lid);l.htmlFor=f.id}});$$('button[title]:not([aria-label])').forEach(b=>b.setAttribute('aria-label',b.title))}

function fillForm(){
  $$('[data-k]').forEach(el=>el.value=get(S,el.dataset.k)??'');
  $$('#docType button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.docType));
  $$('#themes button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.theme));
  items();accentUI();render();
}
function lists(){
  $('#clientSel').innerHTML='<option value="">Load saved client…</option>'+store.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#tplList').innerHTML=store.templates.length?store.templates.map(t=>`<div class="flex items-center justify-between rounded-lg border border-slate-200 px-3 py-1.5 text-sm dark:border-slate-800">
    <span class="truncate">${esc(t.name)}</span><span class="flex shrink-0 gap-1">
    <button class="btn !py-1" data-load="${t.id}">Load</button><button class="ib" data-rm="${t.id}" title="Delete"><i data-lucide="trash-2" class="h-4 w-4"></i></button></span></div>`).join(''):'<p class="text-xs text-slate-500">No saved templates yet.</p>';
  icons();
}

// events
$('#editor').addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.k){set(S,el.dataset.k,el.type==='number'?(parseFloat(el.value)||0):el.value);render()}
  else if(el.dataset.f){const r=el.closest('[data-i]'),it=S.items[+r.dataset.i];it[el.dataset.f]=el.type==='number'?(parseFloat(el.value)||0):el.value;
    r.querySelector('[data-t]').textContent=moneyU(lineU(it));render()}
});
$('#editor').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const i=+b.closest('[data-i]').dataset.i,a=b.dataset.a;
  if(a==='del'){if(S.items.length>1)S.items.splice(i,1);else return toast('Keep at least one line')}
  if(a==='up'&&i>0)[S.items[i-1],S.items[i]]=[S.items[i],S.items[i-1]];
  if(a==='down'&&i<S.items.length-1)[S.items[i+1],S.items[i]]=[S.items[i],S.items[i+1]];
  items();render();
});
$('#addItem').onclick=()=>{S.items.push({id:uid(),desc:'',qty:1,price:0});items();render();const d=$$('#items [data-f=desc]');d[d.length-1].focus()};
$('#docType').onclick=e=>{const v=e.target.dataset.v;if(v){S.docType=v;fillForm()}};
$('#themes').onclick=e=>{const v=e.target.dataset.v;if(v){S.theme=v;fillForm()}};
function shrinkLogo(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const w0=im.naturalWidth||400,h0=im.naturalHeight||200,k=Math.min(1,480/Math.max(w0,h0)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w0*k));c.height=Math.max(1,Math.round(h0*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/png'))};im.src=fr.result};fr.readAsDataURL(file)})}
$('#logoFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;shrinkLogo(f).then(d=>{S.company.logo=d;fillForm();toast('Logo added')}).catch(()=>toast('Could not read that image'))};
$('#swatches').onclick=e=>{const c=e.target.closest('[data-c]');if(c){S.accent=c.dataset.c;accentUI();render()}};
$('#accent').oninput=e=>{S.accent=e.target.value;$('#swatches').querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===S.accent.toLowerCase()));render()};
$('#accentReset').onclick=()=>{S.accent='';accentUI();render()};
$('#logoClear').onclick=()=>{S.company.logo='';fillForm()};
$('#clientSel').onchange=e=>{const c=store.clients.find(x=>x.id===e.target.value);if(c){S.client={name:c.name,email:c.email,address:c.address};fillForm();toast('Client loaded')}};
$('#saveClient').onclick=()=>{
  const k=S.client;if(!k.name.trim())return toast('Enter a client name first');
  const ex=store.clients.find(c=>c.name.toLowerCase()===k.name.trim().toLowerCase());
  if(ex)Object.assign(ex,k);else store.clients.push({id:uid(),...k});
  persist();lists();toast('Client saved')};
$('#delClient').onclick=()=>{const id=$('#clientSel').value;if(!id)return toast('Pick a saved client to delete');store.clients=store.clients.filter(c=>c.id!==id);persist();lists();toast('Client deleted')};
$('#saveTpl').onclick=()=>{
  const n=$('#tplName').value.trim();if(!n)return toast('Give it a name first');
  const snap=JSON.parse(JSON.stringify(S));const ex=store.templates.find(t=>t.name===n);
  if(ex)ex.data=snap;else store.templates.push({id:uid(),name:n,data:snap});
  persist();lists();$('#tplName').value='';toast('Saved “'+n+'”')};

$('#exp').onclick=()=>{

$('#imp').onchange=e=>{
  const f=e.target.files[0];if(!f)return;if(f.size>8e6){e.target.value='';return toast('That file is too large to be a backup')}const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);if(!Array.isArray(d.clients)&&!Array.isArray(d.templates))throw 0;
    const cs=v=>typeof v==='string'?v.slice(0,500):'',sid=v=>typeof v==='string'&&v?v.slice(0,20):uid();

    (Array.isArray(d.templates)?d.templates:[]).slice(0,200).forEach(t=>{if(t&&cs(t.name)&&t.data&&typeof t.data==='object'&&!store.templates.some(x=>x.id===t.id))store.templates.push({id:sid(t.id),name:cs(t.name),data:normalize(t.data)})});
    persist();lists();toast('Import complete')}catch(x){toast('That file is not a valid backup')}};
  r.readAsText(f);e.target.value=''};
const pdfName=()=>(S.docType+'-'+(S.number||'draft')).replace(/[^\w.-]+/g,'_')+'.pdf';
const okChar=c=>c===10||(c>=32&&c<=126)||(c>=160&&c<=255)||[0x20ac,0x2018,0x2019,0x201c,0x201d,0x2013,0x2014,0x2022,0x2026,0x2122].includes(c);
const okStr=s=>[...String(s)].every(ch=>okChar(ch.codePointAt(0)));
const textOk=()=>okStr([S.number,S.company.name,S.company.email,S.company.taxId,S.company.address,S.client.name,S.client.email,S.client.address,S.notes,S.terms,S.footer,S.taxLabel,...S.items.map(i=>i.desc)].join(''));
function pm(n){
  const fix=x=>x.replace(/[\u202f\u00a0]/g,' ');let s=fix(money(n));
  if(!okStr(s)){try{s=fix(new Intl.NumberFormat(undefined,{style:'currency',currency:S.currency,currencyDisplay:'code'}).format(n||0))}catch(e){}}
  if(!okStr(s))throw new Error('unsupported glyphs');return s;
}
const pmU=u=>pm(u/10**dp());
function loadLogo(url){return new Promise(res=>{const im=new Image();if(!/^data:/.test(url))im.crossOrigin='anonymous';
  im.onload=()=>{try{const w=im.naturalWidth||200,h=im.naturalHeight||100,k=Math.min(1,700/Math.max(w,h)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res({d:cv.toDataURL('image/png'),w,h})}catch(e){res(null)}};
  im.onerror=()=>res(null);im.src=url})}
async function textPdf(){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'px',format:[794,1123],hotfixes:['px_scaling'],compress:true});
  const W=794,H=1123,M=48,R=W-M,th=S.theme,c=S.company,k=S.client,rec=S.docType==='Receipt',t=totals();
  const ac=validHex(S.accent)?S.accent:THEME_AC[th],on=onColor(ac),F=th==='exec'?'times':'helvetica';
  const hb=th==='dark'?(validHex(S.accent)?shade(S.accent):'#0f172a'):null;
  const hf=th==='dark'?'#e2e8f0':th==='exec'?ac:'#0f172a',sub=th==='dark'?'#aab2c5':'#64748b',INK='#1e293b',MUT='#64748b';
  const set=(px,st,col)=>{doc.setFont(F,st||'normal');doc.setFontSize(px*.75);doc.setTextColor(col||INK)};
  const T=(s,x,y,o)=>doc.text(String(s),x,y,Object.assign({baseline:'top'},o));
  const wrap=(s,w)=>String(s||'').split('\n').flatMap(l=>l.trim()?doc.splitTextToSize(l,w):['']);
  const rect=(x,y,w,h,col,r)=>{doc.setFillColor(col);r?doc.roundedRect(x,y,w,h,r,r,'F'):doc.rect(x,y,w,h,'F')};
  const hline=(y,col,wd,x1=M,x2=R)=>{doc.setDrawColor(col);doc.setLineWidth(wd);doc.line(x1,y,x2,y)};
  const dt=d=>fdate(d).replace(/[\u202f\u00a0]/g,' ');
  const logo=c.logo?await loadLogo(c.logo):null,logoFailed=!!c.logo&&!logo;
  let lw=0,lh=0;if(logo){const sc=Math.min(1,200/logo.w,60/logo.h);lw=logo.w*sc;lh=logo.h*sc}
  set(13);const addr=wrap(c.address,330);
  const lefth=(logo?lh+10:0)+25+addr.length*19.5+(c.email?19.5:0)+(c.taxId?19.5:0);
  const tsz=th==='exec'?28:th==='min'?36:32,rh=Math.round(tsz*1.2)+8+19.5*(rec?2:3);
  const hy=M+Math.max(lefth,rh)+28;
  if(hb)rect(0,0,W,hy,hb);
  if(th==='dark')rect(0,hy,W,5,ac);
  if(th==='exec')hline(hy+1,'#111111',2,0,W);
  let y=M;
  if(logo){doc.addImage(logo.d,'PNG',M,y,lw,lh);y+=lh+10}
  set(17,'bold',hf);T(c.name,M,y);y+=25;
  set(13,'normal',sub);addr.forEach(l=>{T(l,M,y);y+=19.5});
  if(c.email){T(c.email,M,y);y+=19.5}
  if(c.taxId)T('Tax ID: '+c.taxId,M,y);
  set(tsz,th==='min'?'normal':'bold',th==='dark'?'#ffffff':ac);
  T(th==='exec'?S.docType.toUpperCase():S.docType,R,M,{align:'right'});
  let ry=M+Math.round(tsz*1.2)+8;
  set(13,'bold',hf);T('#'+S.number,R,ry,{align:'right'});ry+=19.5;
  set(13,'normal',sub);T('Issued: '+dt(S.issue),R,ry,{align:'right'});ry+=19.5;
  if(!rec)T('Due: '+dt(S.due),R,ry,{align:'right'});
  y=hy+(th==='dark'?5:th==='exec'?2:0)+6;
  const need=h=>{if(y+h>H-M){doc.addPage();y=M}};
  if(rec){doc.setDrawColor('#16a34a');doc.setLineWidth(3);doc.roundedRect(R-116,y+8,116,44,6,6,'S');set(28,'bold','#16a34a');T('PAID',R-58,y+16,{align:'center'})}
  set(11,'bold',MUT);T(rec?'Received from':'Billed to',M,y);y+=16.5;
  set(15,'bold',INK);T(k.name,M,y);y+=22.5;
  set(13,'normal',MUT);wrap(k.address,330).forEach(l=>{T(l,M,y);y+=19.5});
  if(k.email){T(k.email,M,y);y+=19.5}
  y+=24;
  const cx={q:R-240,p:R-130,t:R-10},dw=(R-M)-290-20;
  const thead=()=>{
    if(th==='min')hline(y+35,ac,2);else rect(M,y,R-M,35,ac);
    set(11,'bold',th==='min'?MUT:on);
    T('Description',M+10,y+10);T('Qty',cx.q,y+10,{align:'right'});T('Unit price',cx.p,y+10,{align:'right'});T('Total',cx.t,y+10,{align:'right'});y+=35};
  thead();
  S.items.forEach(i=>{
    set(13);const dl=wrap(i.desc,dw),h=Math.max(1,dl.length)*19.5+22;
    if(y+h>H-M){doc.addPage();y=M;thead()}
    set(13,'normal',INK);dl.forEach((l,n)=>T(l,M+10,y+11+n*19.5));
    T(String(+i.qty||0),cx.q,y+11,{align:'right'});T(pm(+i.price),cx.p,y+11,{align:'right'});
    set(13,'bold',INK);T(pmU(lineU(i)),cx.t,y+11,{align:'right'});
    hline(y+h,'#e2e8f0',1);y+=h});
  y+=16;
  const rows=[['Subtotal',pmU(t.sub)]];
  if(t.disc)rows.push(['Discount'+(S.discType==='%'?` (${+S.discount}%)`:''),'-'+pmU(t.disc)]);
  if(+S.tax)rows.push([`${S.taxLabel||'Tax'} (${+S.tax}%)`,pmU(t.tax)]);
  need(rows.length*29.5+46);
  const x0=R-290;
  rows.forEach(([a,b])=>{set(13,'normal',MUT);T(a,x0+10,y+5);set(13,'normal',INK);T(b,R-10,y+5,{align:'right'});y+=29.5});
  y+=6;
  if(th==='min')hline(y+1,ac,2,x0,R);else rect(x0,y,290,34,ac,th==='exec'?0:6);
  if(th==='exec')hline(y+34-1.5,'#111111',3,x0,R);
  set(16,'bold',th==='min'?ac:on);T(rec?'Amount paid':'Total due',x0+10,y+5+(th==='min'?2:0));T(pmU(t.total),R-10,y+5+(th==='min'?2:0),{align:'right'});
  y+=34;
  const block=(label,txt,mt)=>{if(!txt)return;y+=mt;need(36);set(11,'bold',MUT);T(label,M,y);y+=16.5;set(13,'normal',INK);wrap(txt,R-M).forEach(l=>{need(19.5);T(l,M,y);y+=19.5})};
  block('Notes',S.notes,32);block('Payment terms',S.terms,16);
  if(S.footer){y+=40;need(44);hline(y,'#e2e8f0',1);set(12,'normal',MUT);wrap(S.footer,R-M).forEach((l,n)=>T(l,W/2,y+14+n*18,{align:'center'}))}
  doc.setProperties({title:S.docType+' '+S.number,author:c.name||'',creator:'Simple Invoice Generator'});
  doc.save(pdfName());
  return{logoFailed};
}
async function imagePdf(){
  const run=async withLogo=>{
    const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0';host.innerHTML=invoiceHTML(true);
    if(!withLogo)host.querySelectorAll('img').forEach(i=>i.remove());
    document.body.appendChild(host);
    try{await html2pdf().set({margin:0,filename:pdfName(),image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0},jsPDF:{unit:'px',format:[794,1123],hotfixes:['px_scaling'],orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:'tr'}}).from(host.firstElementChild).save()}
    finally{host.remove()}};
  try{await run(true);toast('PDF downloaded (image-based: text not selectable)')}
  catch(e){
    if(typeof html2pdf==='undefined')toast('PDF library not loaded — check your connection or the vendor/ folder');
    else if(S.company.logo){try{await run(false);toast('PDF saved without the logo — that image blocks cross-origin use. Upload it instead.')}catch(e2){toast('PDF failed')}}
    else toast('PDF failed')}
}
